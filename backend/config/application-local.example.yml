spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/<database>
    username: <username>
    password: <password>

app:
  storage:
    minio:
      # Local backend runs on the host, while MinIO runs in Docker.
      # Keep these credentials aligned with infrastructure/.env.
      enabled: true
      endpoint: http://localhost:9000
      access-key: minio
      secret-key: minio_password
      bucket: memory-map-media

  auth:
    google:
      client-id: your-google-oauth-client-id.apps.googleusercontent.com

    jwt:
      issuer: memory-map-backend
      access-token-ttl: PT15M
      secret-base64: your-base64-encoded-32-byte-secret

    refresh-token:
      ttl: P30D
