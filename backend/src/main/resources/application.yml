spring:
  application:
    name: memory-map-backend

  servlet:
    multipart:
      max-file-size: 5120KB
      max-request-size: 5632KB

  profiles:
    default: dev

  config:
    import: optional:file:./config/application-local.yml

app:
  invite:
    ttl: ${INVITE_TTL:P30D}
    base-url: ${INVITE_BASE_URL:https://app.memorymap.app}

  storage:
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:}}
      secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
      bucket: ${MINIO_BUCKET:photos}

  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

    jwt:
      issuer: memory-map-backend
      access-token-ttl: PT15M
      secret-base64: ${JWT_SECRET_BASE64:}

    refresh-token:
      ttl: P30D

  rate-limit:
    enabled: true
    max-buckets: 10000
    stale-after: PT10M
    trusted-proxies: []
    auth-login:
      capacity: 8
      refill-tokens: 8
      refill-period: PT1M
    auth-refresh:
      capacity: 20
      refill-tokens: 20
      refill-period: PT1M
    auth-logout:
      capacity: 30
      refill-tokens: 30
      refill-period: PT1M
    invite-accept:
      capacity: 10
      refill-tokens: 10
      refill-period: PT1M
    media-upload:
      capacity: 12
      refill-tokens: 60
      refill-period: PT1H
    private-media-read:
      capacity: 600
      refill-tokens: 600
      refill-period: PT1M
    soundtrack-stream:
      capacity: 240
      refill-tokens: 240
      refill-period: PT1M
    normal-mutation:
      capacity: 60
      refill-tokens: 60
      refill-period: PT1M
